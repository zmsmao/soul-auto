name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  android:
    name: Unit tests, debug APK and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, build debug APK and lint
        working-directory: android-app
        run: bash ./gradlew testDebugUnitTest assembleDebug lintDebug

      - name: Ensure release packaging is blocked without signing
        working-directory: android-app
        shell: bash
        run: |
          set +e
          OUTPUT="$(bash ./gradlew assembleRelease 2>&1)"
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "::error::assembleRelease unexpectedly succeeded without signing credentials."
            exit 1
          fi

          if ! printf '%s' "$OUTPUT" | grep -q "Release signing is not configured"; then
            printf '%s\n' "$OUTPUT"
            echo "::error::Release build failed for an unexpected reason; signing guard was not verified."
            exit 1
          fi

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::An unsigned Release APK was produced despite missing signing credentials."
            exit 1
          fi

          echo "Verified: Release packaging is blocked without signing credentials."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soulbot-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
