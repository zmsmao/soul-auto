name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag points to master
        run: |
          git fetch origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master; then
            echo "::error::Release tags must point to a commit already merged into master."
            exit 1
          fi

      - name: Validate tag and Android version
        id: version
        run: |
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android-app/app/build.gradle)"
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from android-app/app/build.gradle."
            exit 1
          fi

          EXPECTED_TAG="v${VERSION_NAME}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Android versionName $VERSION_NAME (expected $EXPECTED_TAG)."
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION_NAME"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          STORE_PASSWORD: ${{ secrets.SOULBOT_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SOULBOT_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SOULBOT_SIGNING_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.SOULBOT_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing one or more required GitHub Actions secrets. See docs/release-signing.md."
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SOULBOT_SIGNING_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/soulbot-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "SOULBOT_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Run tests, build signed release APK and lint
        working-directory: android-app
        env:
          SOULBOT_SIGNING_STORE_FILE: ${{ runner.temp }}/soulbot-release.jks
          SOULBOT_SIGNING_STORE_PASSWORD: ${{ secrets.SOULBOT_SIGNING_STORE_PASSWORD }}
          SOULBOT_SIGNING_KEY_ALIAS: ${{ secrets.SOULBOT_SIGNING_KEY_ALIAS }}
          SOULBOT_SIGNING_KEY_PASSWORD: ${{ secrets.SOULBOT_SIGNING_KEY_PASSWORD }}
        run: |
          bash ./gradlew testDebugUnitTest testReleaseUnitTest assembleRelease lintRelease

      - name: Verify signature and prepare release assets
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          APK_PATH="android-app/app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

          mkdir -p release-assets
          cp "$APK_PATH" "release-assets/SoulBot-$VERSION_NAME.apk"
          (
            cd release-assets
            sha256sum "SoulBot-$VERSION_NAME.apk" > "SoulBot-$VERSION_NAME.apk.sha256"
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SoulBot ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/SoulBot-${{ steps.version.outputs.version_name }}.apk
            release-assets/SoulBot-${{ steps.version.outputs.version_name }}.apk.sha256
          fail_on_unmatched_files: true
