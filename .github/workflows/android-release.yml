name: Android Release

on:
  pull_request:
    branches:
      - master
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-signing:
    name: Validate repository signing secrets (no publication)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/release-signing-automation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets are present
        env:
          STORE_PASSWORD: ${{ secrets.SOULBOT_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SOULBOT_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SOULBOT_SIGNING_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.SOULBOT_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing one or more required GitHub Actions secrets. See docs/release-signing.md."
            exit 1
          fi
          if [ "$KEY_ALIAS" != "soulbot" ]; then
            echo "::error::The configured signing alias does not match the expected SoulBot alias."
            exit 1
          fi
          echo "All four required signing secrets are present."

      - name: Decode and inspect release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SOULBOT_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SOULBOT_SIGNING_STORE_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/soulbot-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias soulbot > "$RUNNER_TEMP/keystore-details.txt"
          grep -q "PrivateKeyEntry" "$RUNNER_TEMP/keystore-details.txt"
          echo "SOULBOT_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Keystore decoded; store password and private-key entry validated."

      - name: Build signed Release APK and run checks
        working-directory: android-app
        env:
          SOULBOT_SIGNING_STORE_FILE: ${{ runner.temp }}/soulbot-release.jks
          SOULBOT_SIGNING_STORE_PASSWORD: ${{ secrets.SOULBOT_SIGNING_STORE_PASSWORD }}
          SOULBOT_SIGNING_KEY_ALIAS: ${{ secrets.SOULBOT_SIGNING_KEY_ALIAS }}
          SOULBOT_SIGNING_KEY_PASSWORD: ${{ secrets.SOULBOT_SIGNING_KEY_PASSWORD }}
        run: |
          bash ./gradlew testDebugUnitTest testReleaseUnitTest assembleRelease lintRelease

      - name: Verify APK signature and certificate identity
        run: |
          APK_PATH="android-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | tee "$RUNNER_TEMP/apksigner-verification.txt"
          ACTUAL_CERT_SHA256="$(sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' "$RUNNER_TEMP/apksigner-verification.txt" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256="ff473facc919e1a9f120976bd82c456101e0ee98149f307812aac0b2b606800f"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::The APK was signed with an unexpected certificate."
            exit 1
          fi
          mkdir -p signed-validation
          cp "$APK_PATH" signed-validation/SoulBot-2.0.0-signed-validation.apk
          (cd signed-validation && sha256sum SoulBot-2.0.0-signed-validation.apk > SoulBot-2.0.0-signed-validation.apk.sha256)
          echo "APK signature and expected certificate identity verified."

      - name: Upload signed validation APK (not a public Release)
        uses: actions/upload-artifact@v4
        with:
          name: soulbot-2.0.0-signed-validation
          path: signed-validation/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build and publish signed APK
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag points to master
        run: |
          git fetch origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master; then
            echo "::error::Release tags must point to a commit already merged into master."
            exit 1
          fi

      - name: Validate tag and Android version
        id: version
        run: |
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android-app/app/build.gradle)"
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from android-app/app/build.gradle."
            exit 1
          fi

          EXPECTED_TAG="v${VERSION_NAME}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Android versionName $VERSION_NAME (expected $EXPECTED_TAG)."
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION_NAME"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          STORE_PASSWORD: ${{ secrets.SOULBOT_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SOULBOT_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SOULBOT_SIGNING_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.SOULBOT_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing one or more required GitHub Actions secrets. See docs/release-signing.md."
            exit 1
          fi
          if [ "$KEY_ALIAS" != "soulbot" ]; then
            echo "::error::The configured signing alias does not match the expected SoulBot alias."
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SOULBOT_SIGNING_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/soulbot-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "SOULBOT_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Run tests, build signed release APK and lint
        working-directory: android-app
        env:
          SOULBOT_SIGNING_STORE_FILE: ${{ runner.temp }}/soulbot-release.jks
          SOULBOT_SIGNING_STORE_PASSWORD: ${{ secrets.SOULBOT_SIGNING_STORE_PASSWORD }}
          SOULBOT_SIGNING_KEY_ALIAS: ${{ secrets.SOULBOT_SIGNING_KEY_ALIAS }}
          SOULBOT_SIGNING_KEY_PASSWORD: ${{ secrets.SOULBOT_SIGNING_KEY_PASSWORD }}
        run: |
          bash ./gradlew testDebugUnitTest testReleaseUnitTest assembleRelease lintRelease

      - name: Verify signature and prepare release assets
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          APK_PATH="android-app/app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")"
          printf '%s\n' "$VERIFY_OUTPUT"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\\1/p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256="ff473facc919e1a9f120976bd82c456101e0ee98149f307812aac0b2b606800f"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::The Release APK was signed with an unexpected certificate."
            exit 1
          fi

          mkdir -p release-assets
          cp "$APK_PATH" "release-assets/SoulBot-$VERSION_NAME.apk"
          (
            cd release-assets
            sha256sum "SoulBot-$VERSION_NAME.apk" > "SoulBot-$VERSION_NAME.apk.sha256"
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SoulBot ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/SoulBot-${{ steps.version.outputs.version_name }}.apk
            release-assets/SoulBot-${{ steps.version.outputs.version_name }}.apk.sha256
          fail_on_unmatched_files: true
